name: Build SAFEBUY APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      - name: Copy icons to flutter build path
        run: |
          if [ -d .android ]; then
            cp -r android/app/src/main/res/mipmap-* .android/app/src/main/res/
            cp -r android/app/src/main/res/values/ic_launcher_background.xml .android/app/src/main/res/values/
            echo "Icons copied to .android/"
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: safebuy-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
