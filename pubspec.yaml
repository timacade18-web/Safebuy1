name: safebuy_mall
description: SAFEBUY Cross-Border E-Commerce - Flutter Mobile App

publish_to: 'none'
version: 1.1.0+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  cached_network_image: ^3.3.1
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  badges: ^3.1.2
  flutter_svg: ^2.0.9
  intl: ^0.19.0
  url_launcher: ^6.2.0
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/app_icon.png
